name: Deploy

# Publishing a GitHub release deploys that tag: the client to Cloudflare Pages, the server to the VPS.
# Running the workflow by hand with an older tag rolls back to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.0)
        required: true

permissions:
  contents: read

# One deploy at a time; a newer release waits for the running one instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Tag '$TAG' may only contain letters, digits, '.', '_' and '-'."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx server/src/hit.test.ts

  frontend:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build client
        env:
          # Public WebSocket address of the game server, e.g. wss://api.example.com
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::error::Repository variable SERVER_URL is not set (e.g. wss://api.example.com)."
            exit 1
          fi
          npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'pixelyard' }}
        run: |
          # Creates the Pages project on the first deploy; later runs report that it exists.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy client/dist \
            --project-name="$PROJECT" --branch=main \
            --commit-hash="$(git rev-parse HEAD)" --commit-message="Release $TAG"

  backend:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ vars.VPS_USER || 'pixelyard' }}
        run: |
          # Only what the server needs; the client's package.json keeps the npm workspace lockfile valid.
          rsync -az --delete --relative -e "ssh -i ~/.ssh/deploy_key" \
            package.json package-lock.json shared server client/package.json deploy/remote-deploy.sh \
            --exclude node_modules \
            "$USER@$HOST:/opt/pixelyard/releases/$TAG/"
      - name: Install, switch and restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ vars.VPS_USER || 'pixelyard' }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "bash /opt/pixelyard/releases/$TAG/deploy/remote-deploy.sh '$TAG'"
