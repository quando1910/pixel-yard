<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixelyard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(58, 28, 40, 0.88); --ink: #fff; --accent: #f2b632; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #5a9236; color: var(--ink);
      font-family: "Orbitron", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    #game, #labels { position: fixed; inset: 0; }
    #labels { pointer-events: none; overflow: hidden; }
    .hidden { display: none !important; }

    .label { position: absolute; left: 0; top: 0; padding: 2px 8px 2px 6px; border-radius: 10px;
      background: rgba(30, 30, 40, 0.78); font-size: 12px; font-weight: 600; white-space: nowrap;
      will-change: transform; }
    .label::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px;
      border-radius: 50%; background: #3ddc97; }
    .label.me { background: rgba(20, 60, 110, 0.9); }

    #tooltip { position: absolute; left: 0; top: 0; padding: 4px 9px; border-radius: 6px;
      background: #fff; color: #222; font-size: 12px; font-weight: 700; white-space: nowrap;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); will-change: transform; z-index: 2; }
    kbd { display: inline-block; padding: 0 5px; border-radius: 4px; background: #222; color: #fff; }

    #hud { position: fixed; left: 14px; top: 14px; width: 230px; padding: 12px; border-radius: 10px;
      background: var(--panel); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
    #timer { font-size: 22px; font-weight: 800; letter-spacing: 1px; text-align: center; }
    #phase { margin-top: 2px; font-size: 11px; text-align: center; opacity: 0.85; }
    #board { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; max-height: 50vh; overflow: auto; }
    #board li { display: flex; gap: 6px; padding: 3px 6px; border-radius: 5px; }
    #board li:nth-child(odd) { background: rgba(255, 255, 255, 0.07); }
    #board li.me { outline: 1px solid var(--accent); }
    #board .pos { width: 18px; opacity: 0.7; }
    #board .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #board .val { font-variant-numeric: tabular-nums; }
    #board .title { opacity: 0.7; font-size: 11px; background: none; padding-left: 0; }
    #admin { display: flex; gap: 8px; margin-top: 10px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer;
      color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); white-space: nowrap; font-size: 12px; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #btnStart { flex: 1; background: #2e9e5b; }
    #btnEnd { flex: 1; background: #d64545; }

    #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 12px;
      border-radius: 8px; background: rgba(30, 30, 40, 0.78); font-size: 12px; }
    #mute { position: fixed; right: 14px; top: 14px; width: 38px; height: 38px; padding: 0; background: var(--panel); display: flex; align-items: center; justify-content: center; }
    #zoom { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    #zoom button { width: 38px; height: 38px; padding: 0; background: var(--panel); font-size: 20px; line-height: 1; }
    #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 140px; font-weight: 900; color: #fff; text-shadow: 0 6px 0 #b0303c, 0 0 24px rgba(0, 0, 0, 0.5);
      pointer-events: none; }
    #status { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 8px 14px;
      border-radius: 8px; background: #d64545; font-size: 13px; font-weight: 700; }

    #modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(20, 30, 20, 0.6); }
    #nameForm { width: min(340px, calc(100vw - 32px)); padding: 22px; border-radius: 12px;
      background: #2c2c3a; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35); }
    #nameForm h1 { margin: 0 0 14px; font-size: 22px; color: var(--accent); }
    #nameForm label { display: block; margin-bottom: 6px; font-size: 12px; opacity: 0.85; }
    #nameInput { width: 100%; padding: 10px; border: 2px solid #55556a; border-radius: 6px; background: #1d1d28;
      color: #fff; font: inherit; font-size: 15px; outline: none; }
    #nameInput:focus { border-color: var(--accent); }
    #nameErr { min-height: 16px; margin: 6px 0 10px; font-size: 11px; opacity: 0.75; }
    #genderPick { display: flex; gap: 10px; margin-bottom: 14px; }
    #genderPick button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 8px 8px; background: #1d1d28; border: 2px solid #55556a; box-shadow: none; }
    #genderPick button.sel { border-color: var(--accent); background: #2a2a3c; }
    #genderPick canvas { width: 54px; height: 78px; image-rendering: pixelated; }
    #nameBtn { width: 100%; padding: 10px; background: #2e9e5b; font-size: 15px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="labels"><div id="tooltip" class="hidden">Press <kbd>X</kbd> to drive</div></div>

  <div id="hud" class="hidden">
    <div id="timer">00:00.00</div>
    <div id="phase"></div>
    <ol id="board"></ol>
    <div id="admin" class="hidden">
      <button id="btnStart" type="button">Start race</button>
      <button id="btnEnd" type="button">End race</button>
    </div>
  </div>
  <div id="hint" class="hidden"></div>
  <button id="mute" type="button" title="Mute music"></button>
  <div id="zoom" class="hidden">
    <button id="zoomIn" type="button" title="Zoom in">+</button>
    <button id="zoomOut" type="button" title="Zoom out">−</button>
  </div>
  <div id="countdown" class="hidden"></div>
  <div id="status" class="hidden"></div>

  <div id="modal" class="hidden">
    <form id="nameForm">
      <h1>Pixelyard</h1>
      <label for="nameInput">Your name</label>
      <input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false" />
      <p id="nameErr">At least 2 characters</p>
      <label>Character</label>
      <div id="genderPick"></div>
      <button id="nameBtn" type="submit" disabled>Join</button>
    </form>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
